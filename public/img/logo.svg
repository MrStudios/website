<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <radialGradient id="swirl" r="70%">
            <animate attributeName="cx" values="30%;70%;30%" dur="2s" repeatCount="indefinite" />
            <animate attributeName="cy" values="30%;70%;30%" dur="2s" repeatCount="indefinite" />
            <stop offset="0%" stop-color="#8b5cf6">
                <animate attributeName="stop-color" values="#8b5cf6; #ec4899; #8b5cf6" dur="5s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#ec4899">
                <animate attributeName="stop-color" values="#ec4899; #8b5cf6; #ec4899" dur="3s" repeatCount="indefinite" />
            </stop>
        </radialGradient>
    </defs>
    <g transform="translate(50, 50)">
        <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" font-weight="700" fill="url(#swirl)" pointer-events="none">
            <tspan font-size="100">e</tspan>
            <tspan dx="-10" dy="15" font-size="60">.s</tspan>
        </text>
    </g>
</svg>
